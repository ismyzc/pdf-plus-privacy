<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ortak hatme davet – Kur'an-ı Kerim</title><meta name="robots" content="noindex"><meta property="og:title" content="Ortak hatme davet"><meta property="og:description" content="Kur'an-ı Kerim uygulamasında ortak hatme katıl, bir cüz al."><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#F7F5EF;color:#14231D}
.hero{background:linear-gradient(135deg,#0E6B4F,#04261C);color:#fff;padding:48px 24px 40px;text-align:center}
.tag{color:#F1DC9C;font-weight:800;font-size:13px;letter-spacing:.5px}h1{margin:10px 0 6px;font-size:28px}.hero p{margin:0;opacity:.8}
.wrap{max-width:460px;margin:-22px auto 40px;padding:0 20px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 6px 18px rgba(7,61,45,.08);text-align:center}
.code{font-size:34px;font-weight:800;letter-spacing:6px;color:#0E6B4F;margin:6px 0 18px}.muted{color:#5C6B65;font-size:14px;line-height:1.5}
a.btn{display:block;padding:15px;border-radius:14px;text-decoration:none;font-weight:800;margin-top:12px}.primary{background:#0E6B4F;color:#fff}.store{background:#E3F1EA;color:#073D2D}
</style></head><body>
<div class="hero"><div class="tag">✦ ORTAK HATİM</div><h1>Hatme davet edildin</h1><p>Bir cüz al, hatmi birlikte tamamlayalım.</p></div>
<div class="wrap"><div class="card">
<div class="muted">Hatim kodu</div><div class="code" id="code">——————</div>
<a class="btn primary" id="open" href="#">Uygulamada aç</a>
<a class="btn store" id="ios" href="https://apps.apple.com/app/id6819459955">App Store'dan indir</a>
<a class="btn store" id="android" href="https://play.google.com/store/apps/details?id=com.ytsoft.kuran">Google Play'den indir</a>
<p class="muted" style="margin-top:18px">Uygulama yüklü değilse önce indir, sonra bu linke tekrar dokun ya da uygulamada <b>Ortak hatim › Kodla katıl</b> bölümüne kodu yaz.</p>
</div></div>
<script>
var c=(new URLSearchParams(location.search).get('c')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
if(c)document.getElementById('code').textContent=c;
var ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua),and=/Android/.test(ua);
if(ios)document.getElementById('android').style.display='none';
if(and)document.getElementById('ios').style.display='none';
var o=document.getElementById('open');
o.href=and?'intent://hatim/'+c+'#Intent;scheme=kuran;package=com.ytsoft.kuran;end':'kuran://hatim/'+c;
if(!c)o.style.display='none';
</script></body></html>
